# Retired: the Workout Logger history now lives on the portfolio at
# https://harsh-0024.github.io/projects/workout-logger/
#
# This workflow only publishes a small page that sends visitors there. It runs
# when main is pushed or from the Actions tab; there is no nightly rebuild.
name: Publish Redirect

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
